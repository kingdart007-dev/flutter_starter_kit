name: Build and Push Flutter Starter Kit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup State Management and Providers (Manual Riverpod)
        run: |
          # إنشاء مجلدات إدارة الحالة والتخزين
          mkdir -p lib/core/storage lib/core/router lib/features/home/presentation

          # كتابة مزود الثيم يدوياً باستخدام Riverpod Notifier
          cat << 'EOF' > lib/core/theme/theme_provider.dart
          import 'package:flutter/material.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';
          import 'app_theme.dart';

          class ThemeNotifier extends Notifier<ThemeMode> {
            @override
            ThemeMode build() => ThemeMode.system;

            void toggleTheme(ThemeMode mode) {
              state = mode;
            }
          }

          final themeProvider = NotifierProvider<ThemeNotifier, ThemeMode>(ThemeNotifier.new);
          EOF

          # رفع الملفات للمستودع
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: add manual riverpod theme provider"
          git push
