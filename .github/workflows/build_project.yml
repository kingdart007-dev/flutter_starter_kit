name: Build and Push Flutter Starter Kit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Core Structure and Localization Setup
        run: |
          # إنشاء ملف إعدادات الثيم والتفضيلات يدوياً
          mkdir -p lib/core/theme lib/core/localization lib/core/storage

          # كتابة ملف الثيم الأساسي (Light & Dark)
          cat << 'EOF' > lib/core/theme/app_theme.dart
          import 'package:flutter/material.dart';

          class AppTheme {
            static final ThemeData lightTheme = ThemeData(
              brightness: Brightness.light,
              useMaterial3: true,
              colorScheme: ColorScheme.fromSeed(seedColor: Colors.blue, brightness: Brightness.light),
            );

            static final ThemeData darkTheme = ThemeData(
              brightness: Brightness.dark,
              useMaterial3: true,
              colorScheme: ColorScheme.fromSeed(seedColor: Colors.blue, brightness: Brightness.dark),
            );
          }
          EOF

          # رفع التحديثات الجديدة للمستودع
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: add core theme architecture and setup"
          git push
